 <!-- This specifies what kind of document it is, in this case HTML5, as well as what language will be used -->
<!DOCTYPE html>
<html lang="en">
        <!-- The Head in HTML5 is a container for metadata -->
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> "My Own Summer (Shove It)"</title>
        <meta name = "Description" content="These are the lyrics to My Own Summer by Deftones">
        <meta name = "robots" content="no follow, no index">
    </head>
    <body>
        <main>
                <!-- The main holds the primary information of the page. There is only one, and it should not contain elements that a repeated across pages -->
                <section>
                    <!--I used a section to hold all of the lyrics and because they are all the same content and a section must have a heading -->
                         <!-- This divwill hold our title and artist. H elements go in order, from h1 to h6 each is smaller than the one before it-->
                        <div>
                            <h1> "My Own Summer (Shove It)"</h1>
                         <h2> by Deftones</h2>
                        </div> 
                        
                        <div>
                            <!--This div will hold our image-->
                            <figure>
                             <!-- Here i've put our image and added the alt text that describes what the image is-->
                             <img src="./Media/img/DeftonsAlbum.png" alt="Cover Image of Deftone's Album - Hexagram">
                             <!--We used a figure to add the image so we can use the figcaption. That elemnt adds a small text under an image so we can add a description. One that is visible, compared to the alt text -->
                             <figcaption>Cover Image of Deftone's Album - Hexagram</figcaption>
                            </figure>
                        </div>
                        <div>
                        <!-- Each div holds a verse. I use <p> for each section, going back in line using a break-->
                        <!-- Verse 1-->
                            <p>Hey you, big star<br>
                            Tell me when it's over</p>
                        <!-- Second verse -->   
                            <p>Hey you, big mood<br>
                            Guide me to shelter<br>
                            'Cause I'm through when the two<br>
                            Hits the six and it's summer (Cloud)</p>
                        </div>
                </section>        
        </main>      
    </body>                
</html>
